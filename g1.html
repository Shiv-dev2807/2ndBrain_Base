<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECT AIR-1 · GATE CS 2027 God-Level Command Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070B12;
            --bg-card: rgba(15, 23, 42, 0.75);
            --bg-card-hover: rgba(30, 41, 59, 0.85);
            --border-card: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(0, 240, 255, 0.3);
            
            --cyan: #00F0FF;
            --cyan-glow: rgba(0, 240, 255, 0.35);
            --violet: #A855F7;
            --violet-glow: rgba(168, 85, 247, 0.35);
            --amber: #F59E0B;
            --amber-glow: rgba(245, 158, 11, 0.3);
            --emerald: #10B981;
            --emerald-glow: rgba(16, 185, 129, 0.3);
            --crimson: #EF4444;
            --blue: #3B82F6;
            
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --text-dim: #64748B;
            
            --font-main: 'Inter', system-ui, -apple-system, sans-serif;
            --font-display: 'Outfit', sans-serif;
            --font-code: 'JetBrains Mono', monospace;
            
            --sidebar-w: 275px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 240, 255, 0.04) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(168, 85, 247, 0.04) 0%, transparent 40%);
            background-attachment: fixed;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(7, 11, 18, 0.9); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--cyan); }

        .app-container { display: flex; min-height: 100vh; }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-w);
            background: rgba(11, 17, 28, 0.94);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-card);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0; bottom: 0; left: 0;
            z-index: 100;
            transition: var(--transition);
        }

        .brand {
            padding: 24px 20px;
            border-bottom: 1px solid var(--border-card);
        }

        .brand-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            background: rgba(0, 240, 255, 0.1);
            color: var(--cyan);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
            border: 1px solid rgba(0, 240, 255, 0.2);
        }

        .brand-name {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #FFF 30%, var(--cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-sub {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 500;
        }

        .navlist {
            padding: 16px 12px;
            overflow-y: auto;
            flex: 1;
        }

        .nav-group-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-dim);
            padding: 16px 12px 6px 12px;
        }

        .navlink {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 500;
            margin-bottom: 4px;
            transition: var(--transition);
            cursor: pointer;
        }

        .navlink:hover {
            color: #FFF;
            background: rgba(255, 255, 255, 0.04);
            transform: translateX(3px);
        }

        .navlink.active {
            color: var(--cyan);
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.2);
            font-weight: 600;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
        }

        .navcode {
            font-family: var(--font-code);
            font-size: 11px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.06);
            margin-right: 12px;
            color: var(--text-muted);
        }

        .navlink.active .navcode {
            background: rgba(0, 240, 255, 0.2);
            color: var(--cyan);
        }

        .sidebar-foot {
            padding: 16px 20px;
            border-top: 1px solid var(--border-card);
            font-size: 12px;
            color: var(--text-dim);
            background: rgba(0, 0, 0, 0.2);
        }

        .sidebar-foot strong { color: var(--amber); }

        /* Main Content */
        .main {
            margin-left: var(--sidebar-w);
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        /* Top HUD */
        .hud {
            padding: 18px 32px;
            border-bottom: 1px solid var(--border-card);
            background: rgba(11, 17, 28, 0.75);
            backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 90;
        }

        .hud-left { display: flex; flex-direction: column; }
        .hud-title {
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: 800;
            color: #FFF;
            letter-spacing: -0.5px;
        }
        .hud-date { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
        .hud-right { display: flex; align-items: center; gap: 16px; }

        .hud-stat {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-sm);
            padding: 6px 14px;
            text-align: center;
        }
        .hud-stat-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
        }
        .hud-stat-val {
            font-family: var(--font-code);
            font-size: 16px;
            font-weight: 700;
            color: var(--cyan);
        }

        .rank-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.3);
            font-size: 13px;
            font-weight: 600;
            color: var(--violet);
        }
        .rank-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--violet);
            box-shadow: 0 0 10px var(--violet);
        }

        /* Viewport Container */
        .viewport {
            padding: 32px;
            max-width: 1440px;
            width: 100%;
            margin: 0 auto;
        }

        /* Cards & Grid */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-lg);
            padding: 24px;
            backdrop-filter: blur(16px);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        .card:hover {
            border-color: rgba(255, 255, 255, 0.15);
            background: var(--bg-card-hover);
        }
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .card-title {
            font-family: var(--font-display);
            font-size: 18px;
            font-weight: 700;
            color: #FFF;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }

        @media (max-width: 1024px) {
            .grid-4 { grid-template-columns: repeat(2, 1fr); }
            .grid-3 { grid-template-columns: repeat(1, 1fr); }
        }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main { margin-left: 0; }
            .grid-2, .grid-4 { grid-template-columns: 1fr; }
            .viewport { padding: 16px; }
            .hud { padding: 16px; }
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            outline: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--cyan) 0%, #00B8D9 100%);
            color: #070B12;
            box-shadow: 0 4px 20px var(--cyan-glow);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(0, 240, 255, 0.5);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-card);
            color: var(--text-main);
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: var(--crimson);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.3);
        }
        .btn-sm { padding: 6px 12px; font-size: 12px; }

        /* Hero Banner */
        .hero-banner {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.1) 0%, rgba(168, 85, 247, 0.1) 100%);
            border: 1px solid var(--border-glow);
            border-radius: var(--radius-lg);
            padding: 32px;
            margin-bottom: 28px;
            position: relative;
            overflow: hidden;
        }
        .hero-banner::before {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            background: radial-gradient(circle at 90% 10%, rgba(0, 240, 255, 0.15), transparent 50%);
            pointer-events: none;
        }
        .hero-title {
            font-family: var(--font-display);
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        .hero-desc { color: var(--text-muted); font-size: 15px; max-width: 880px; line-height: 1.6; }

        /* Badges */
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .badge-cyan { background: rgba(0, 240, 255, 0.15); color: var(--cyan); border: 1px solid rgba(0, 240, 255, 0.3); }
        .badge-violet { background: rgba(168, 85, 247, 0.15); color: var(--violet); border: 1px solid rgba(168, 85, 247, 0.3); }
        .badge-amber { background: rgba(245, 158, 11, 0.15); color: var(--amber); border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-emerald { background: rgba(16, 185, 129, 0.15); color: var(--emerald); border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-crimson { background: rgba(239, 68, 68, 0.15); color: var(--crimson); border: 1px solid rgba(239, 68, 68, 0.3); }

        /* Progress Bar */
        .progress-bar-bg {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            height: 10px;
            overflow: hidden;
            position: relative;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--cyan), var(--violet));
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        /* Timetable Blocks */
        .timeline-item { display: flex; gap: 20px; padding: 16px 0; border-bottom: 1px solid var(--border-card); }
        .timeline-item:last-child { border-bottom: none; }
        .timeline-time { width: 140px; font-family: var(--font-code); font-size: 13px; font-weight: 700; color: var(--cyan); flex-shrink: 0; }
        .timeline-content h4 { font-size: 15px; font-weight: 700; color: #FFF; margin-bottom: 4px; }
        .timeline-content p { font-size: 13.5px; color: var(--text-muted); line-height: 1.5; }

        /* Checkbox items */
        .task-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 16px;
            border-radius: var(--radius-sm); background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-card); margin-bottom: 8px; cursor: pointer; transition: var(--transition);
        }
        .task-item:hover { background: rgba(255, 255, 255, 0.05); }
        .task-item.completed { opacity: 0.6; text-decoration: line-through; }
        .task-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--cyan); cursor: pointer; }

        /* Form Controls */
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-control {
            width: 100%; padding: 10px 14px; background: rgba(7, 11, 18, 0.8);
            border: 1px solid var(--border-card); border-radius: var(--radius-sm);
            color: #FFF; font-family: var(--font-main); font-size: 14px; outline: none; transition: var(--transition);
        }
        .form-control:focus { border-color: var(--cyan); box-shadow: 0 0 10px var(--cyan-glow); }

        /* Tables */
        .dtable { width: 100%; border-collapse: collapse; font-size: 13.5px; text-align: left; }
        .dtable th { padding: 12px 14px; background: rgba(0, 0, 0, 0.3); color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border-card); }
        .dtable td { padding: 14px; border-bottom: 1px solid var(--border-card); color: var(--text-muted); }
        .dtable tr:hover td { background: rgba(255, 255, 255, 0.02); color: #FFF; }

        /* Syllabus Topic Row */
        .topic-row-card {
            background: rgba(15, 23, 42, 0.5); border: 1px solid var(--border-card);
            border-radius: var(--radius-sm); padding: 12px 16px; margin-bottom: 8px;
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
        }
        .topic-row-card:hover { border-color: rgba(255, 255, 255, 0.15); background: rgba(15, 23, 42, 0.8); }
        .topic-name { font-size: 14px; font-weight: 500; color: #FFF; flex: 1; }
        .topic-stages { display: flex; gap: 6px; }
        .stage-btn {
            padding: 4px 8px; border-radius: 4px; font-size: 11px; font-family: var(--font-code); font-weight: 700;
            border: 1px solid var(--border-card); background: rgba(255, 255, 255, 0.04); color: var(--text-dim); cursor: pointer; transition: var(--transition);
        }
        .stage-btn.active { background: rgba(0, 240, 255, 0.2); color: var(--cyan); border-color: var(--cyan); }

        /* Flashcard Component */
        .flashcard-box {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.9) 100%);
            border: 1px solid var(--border-glow); border-radius: var(--radius-lg);
            padding: 40px; text-align: center; min-height: 220px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; position: relative; user-select: none; transition: var(--transition);
        }
        .flashcard-box:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0, 240, 255, 0.15); }
        .flashcard-sub { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--cyan); letter-spacing: 1.5px; margin-bottom: 12px; }
        .flashcard-q { font-family: var(--font-display); font-size: 20px; font-weight: 700; color: #FFF; margin-bottom: 16px; }
        .flashcard-a { font-family: var(--font-code); font-size: 16px; color: var(--emerald); line-height: 1.5; display: none; }

        /* Mobile topbar */
        .mobile-topbar {
            display: none; align-items: center; justify-content: space-between; padding: 12px 20px;
            background: rgba(11, 17, 28, 0.95); border-bottom: 1px solid var(--border-card);
        }
        @media (max-width: 768px) { .mobile-topbar { display: flex; } }
        .hamb { background: none; border: none; color: #FFF; font-size: 24px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <span class="brand-badge">Project · AIR-1</span>
                <div class="brand-name">GATE CS 2027</div>
                <div class="brand-sub" id="brandDaysLeft">— Days Remaining</div>
            </div>
            <ul class="navlist" id="navlist"></ul>
            <div class="sidebar-foot">
                Target: <strong>6th Feb 2027</strong><br>
                Goal: <strong>AIR 1 (IITB / IISc CSE)</strong>
            </div>
        </aside>

        <!-- Main View -->
        <div class="main">
            <div class="mobile-topbar">
                <button class="hamb" id="hambBtn" onclick="toggleSidebar()">☰</button>
                <strong style="font-family:var(--font-display); color:var(--cyan);">GATE AIR 1</strong>
            </div>

            <header class="hud">
                <div class="hud-left">
                    <div class="hud-title" id="hudTitle">Dashboard</div>
                    <div class="hud-date" id="hudDate">—</div>
                </div>
                <div class="hud-right">
                    <div class="hud-stat">
                        <div class="hud-stat-label">Exam D-Day</div>
                        <div class="hud-stat-val" id="hudDday">—</div>
                    </div>
                    <div class="hud-stat">
                        <div class="hud-stat-label">Phase</div>
                        <div class="hud-stat-val" id="hudPhase" style="color:var(--cyan)">Phase 1</div>
                    </div>
                    <div class="rank-chip">
                        <span class="rank-dot"></span>
                        <span>Tier: <b id="rankLabel" style="color:#FFF;">Recruit</b></span>
                    </div>
                </div>
            </header>

            <main class="viewport" id="viewport"></main>
        </div>
    </div>

    <script>
        // Core Data Definitions
        const EXAM_DATE = new Date('2027-02-06T09:30:00+05:30');
        const START_DATE = new Date('2026-07-27T04:30:00+05:30');

        const NAV = [

                ]
            },
            {
                code: 'DS', name: 'Data Structures', level: 'Level 2', weight: '8 Marks',
                topics: [
                    'Arrays, Stacks, Queues & Applications',
                    'Singly, Doubly & Circular Linked Lists',
                    'Trees: Binary Trees, Traversals, BST Operations',
                    'Binary Heaps, Priority Queues & Heap Sort',
                    'Graph Representations: Adjacency List & Matrix'
                ]
            },
            {
                code: 'ALGO', name: 'Algorithms', level: 'Level 2', weight: '8 Marks',
                topics: [
